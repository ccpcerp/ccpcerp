# Scoped follow-on GitHub-hosted accounting attribution test gate; no shared site.
# Intentionally no push, schedule, deploy, self-hosted runner, or production access.
name: Withdrawal Slip - isolated issue accounting attribution

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - review/withdrawal-cancellation-ledger-ci-2026-10-16
    paths:
      - .github/workflows/withdrawal-issue-accounting-ci.yml
      - ccpcerp/ccpc_erp/withdrawal_slip_stock.py
      - ccpcerp/ccpc_erp/doctype/withdrawal_slip/test_*.py
      - ccpcerp/ccpc_erp/doctype/withdrawal_slip/ci_concurrent_issue_worker.py

permissions:
  contents: read

concurrency:
  group: withdrawal-isolated-frappe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frappe-regression:
    # The CI branch has no production credentials, and only this approved same-repo
    # PR may spend hosted-runner minutes. No third-party fork code.
    if: ${{ github.event.pull_request.head.repo.full_name == 'ccpcerp/ccpcerp' && github.head_ref == 'review/withdrawal-issue-accounting-ci-2026-10-17' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "Yes"
      BENCH_DIR: ${{ github.workspace }}/../ccpc-frappe-bench
      TEST_SITE: ci-withdrawal.localhost
      # Ephemeral fake values solely for this runner's disposable MariaDB/site.
      CI_DB_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_ADMIN_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
      FEATURE_BASE: b812f2895b186790c226ae2dd989929282b70517

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379

    steps:
      - name: Checkout reviewed app changes (no persistent Git credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify feature ancestry and exact current test inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FEATURE_BASE" HEAD
          python3 - <<'PY'
          import ast
          from pathlib import Path
          suites = {
              "test_withdrawal_slip.py": 37,
              "test_withdrawal_issue_safety.py": 17,
              "test_withdrawal_peer_issuance.py": 18,
          }
          root = Path("ccpcerp/ccpc_erp/doctype/withdrawal_slip")
          total = 0
          for filename, expected in suites.items():
              parsed = ast.parse((root / filename).read_text(encoding="utf-8"))
              actual = sum(
                  isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name.startswith("test_")
                  for node in ast.walk(parsed)
              )
              if actual != expected:
                  raise SystemExit(f"{filename}: expected {expected}, found {actual}")
              print(f"Defined (not yet executed): {filename}: {actual}")
              total += actual
          if total != 72:
              raise SystemExit(f"Expected 72 definitions, found {total}")
          PY

      - name: Set up Python 3.14 and Node 24
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install disposable runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mariadb-client libmariadb-dev libmariadb-dev-compat pkg-config
          npm install -g yarn
          python -m pip install frappe-bench
          MYSQL_PWD="$CI_DB_ROOT_PASSWORD" mariadb --host=127.0.0.1 --user=root \
            -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Initialize an independent Frappe v16 bench
        shell: bash
        run: |
          set -euo pipefail
          bench init --frappe-branch version-16 --skip-assets --skip-redis-config-generation \
            --python "$(command -v python)" "$BENCH_DIR"
          cd "$BENCH_DIR"
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000

      - name: Install ERPNext v16 and the exact reviewed app checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$BENCH_DIR"
          bench get-app --branch version-16 erpnext https://github.com/frappe/erpnext
          # The private CCPC source comes only from the current Actions checkout.
          # No token-bearing URL or clone of CCPC from the shared ERP server.
          bench get-app ccpcerp "$GITHUB_WORKSPACE"
          git -C apps/ccpcerp fetch --quiet --no-tags "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          git -C apps/ccpcerp checkout --quiet --detach "$GITHUB_SHA"
          test "$(git -C apps/ccpcerp rev-parse HEAD)" = "$GITHUB_SHA"
          git -C apps/ccpcerp merge-base --is-ancestor "$FEATURE_BASE" HEAD
          bench setup requirements --dev
          echo "Frappe source: $(git -C apps/frappe rev-parse HEAD)"
          echo "ERPNext source: $(git -C apps/erpnext rev-parse HEAD)"
          echo "CCPC app source: $(git -C apps/ccpcerp rev-parse HEAD)"

      - name: Create disposable test site and install apps
        shell: bash
        run: |
          set -euo pipefail
          cd "$BENCH_DIR"
          bench new-site "$TEST_SITE" --db-host 127.0.0.1 --db-port 3306 \
            --db-root-username root --db-root-password "$CI_DB_ROOT_PASSWORD" \
            --admin-password "$CI_ADMIN_PASSWORD"
          bench --site "$TEST_SITE" install-app erpnext
          bench --site "$TEST_SITE" install-app ccpcerp
          # CCPC's Stock Entry custom link fields and scoped roles are created
          # by ccpcerp.setup.after_migrate, not just by install-app. This affects
          # ONLY the disposable CI site; NEVER run on CCPC shared-host sites.
          bench --site "$TEST_SITE" migrate
          bench --site "$TEST_SITE" set-config allow_tests true

      - name: Execute current Withdrawal Slip Frappe test modules
        shell: bash
        run: |
          set -euo pipefail
          cd "$BENCH_DIR"
          # Run all three modules even when the first fails, while preserving
          # a failing Actions conclusion if ANY test module fails.
          failed=0
          for module in \
            ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_withdrawal_slip \
            ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_withdrawal_issue_safety \
            ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_withdrawal_peer_issuance
          do
            echo "::group::Frappe test module: $module"
            if bench --site "$TEST_SITE" run-tests --module "$module"; then
              echo "PASSED module: $module"
            else
              echo "::error::FAILED module: $module"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Execute nine real SQL, WSGI, concurrency, cancellation and accounting tests
        env:
          CCPC_ALLOW_COMMIT_PROBE: isolated-only
          CCPC_ALLOW_CONCURRENCY_PROBE: isolated-only
          CCPC_ALLOW_HTTP_PROBE: isolated-only
          CCPC_ALLOW_CANCELLATION_PROBE: isolated-only
          CCPC_ALLOW_ACCOUNTING_PROBE: isolated-only
        shell: bash
        run: |
          set -euo pipefail
          cd "$BENCH_DIR"
          echo "::group::Real issue expense account, Cost Center, source context, SLE/GL, concurrency and cancellation"
          bench --site "$TEST_SITE" run-tests --module ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_withdrawal_real_ledger_integration
          echo "::endgroup::"

      - name: Report both test scopes
        if: always()
        shell: bash
        run: |
          {
            echo "## Withdrawal Slip isolated Frappe test gate"
            echo "Runner: GitHub-hosted Ubuntu 24.04; disposable MariaDB and Redis."
            echo "App checkout SHA: $GITHUB_SHA"
            echo "Baseline feature commit: $FEATURE_BASE"
            echo "Scope: 72 mocked Frappe regressions PLUS 9 real MariaDB/WSGI methods including native dimension control and issue-side attribution (only if step completed)."
            echo "Still not tested by this CI: return Material Receipt posting, configured CCPC beneficiary Cost Center mapping where absent, shared-server runtime, and backup recovery."
            echo "Production status: NO-GO regardless of this job's result."
          } >> "$GITHUB_STEP_SUMMARY"
