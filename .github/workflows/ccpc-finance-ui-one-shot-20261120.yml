# Intentionally a one-shot isolated runner. Pushes that change normal app/test files
# do NOT match the path filter. Do not add pull_request, schedules or other triggers.
name: CCPC Finance UI isolated one-shot Playwright validation

on:
  push:
    branches:
      - test/phase1-finance-playwright-ui-2026-11-20
    paths:
      - .github/workflows/ccpc-finance-ui-one-shot-20261120.yml

permissions:
  contents: read

concurrency:
  group: ccpc-finance-ui-one-shot-20261120
  cancel-in-progress: false

jobs:
  isolated-finance-ui:
    # Fail closed on any unexpected repository, branch, or event.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'ccpcerp/ccpcerp' &&
      github.ref == 'refs/heads/test/phase1-finance-playwright-ui-2026-11-20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out test-only reviewed branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard exact source and test files
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "ccpcerp/ccpcerp"
          test "${GITHUB_REF}" = "refs/heads/test/phase1-finance-playwright-ui-2026-11-20"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object tests/phase1-finance-ui/phase1-finance.spec.cjs)" = "a9907ecaf6a265737d0e67809fe4726f3ed4b55e"
          test "$(git hash-object tests/phase1-finance-ui/package.json)" = "dd9dabd16d76382ddcfe9a6c9da496392e778052"
          test "$(git hash-object ccpcerp/ccpc_erp/page/ccpc_phase1_finance/ccpc_phase1_finance.js)" = "413cc18d294af23acc4b2b34907fe0bfcbd57fdb"
          echo "Reviewed exact Finance UI test and app source verified."
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned test packages and disposable Chromium
        working-directory: tests/phase1-finance-ui
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts --fetch-retries=0
          npm ls --depth=0
          npx playwright install --with-deps chromium
      - name: Execute original Node Playwright Test suite
        working-directory: tests/phase1-finance-ui
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          npm run check
          npm test
          sha256sum package-lock.json
      - name: Preserve non-secret dependency lockfile for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ccpc-finance-ui-npm-lockfile
          path: tests/phase1-finance-ui/package-lock.json
          if-no-files-found: error
          retention-days: 3
