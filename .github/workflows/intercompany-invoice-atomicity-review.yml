# GitHub-only disposable ERPNext/Frappe/MariaDB acceptance test.
# No CCPC site, database, credentials, schedule, deploy or self-hosted runner.
name: Intercompany paired invoice SQL atomicity review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - review/intercompany-invoice-transaction-2026-10-20
    paths:
      - ".github/workflows/intercompany-invoice-atomicity-review.yml"
      - "ccpcerp/ccpc_erp/doctype/intercompany_material_billing_batch/*.py"

permissions:
  contents: read

concurrency:
  group: intercompany-atomicity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-intercompany-db:
    if: ${{ github.event.pull_request.head.repo.full_name == 'ccpcerp/ccpcerp' && github.head_ref == 'review/intercompany-invoice-transaction-2026-10-20' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: "Yes"
      BENCH_DIR: ${{ github.workspace }}/../ccpc-ic-bench
      TEST_SITE: ci-intercompany.localhost
      CI_DB_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_ADMIN_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
      CCPC_ALLOW_IC_SQL_PROBE: isolated-only

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact reviewed same-repository PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 53ab180d2572def75beff9a0dbd0eb8b927977da HEAD
          test "$GITHUB_HEAD_REF" = "review/intercompany-invoice-transaction-2026-10-20"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install disposable bench dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mariadb-client libmariadb-dev libmariadb-dev-compat pkg-config
          npm install -g yarn
          python -m pip install frappe-bench
          MYSQL_PWD="$CI_DB_ROOT_PASSWORD" mariadb --host=127.0.0.1 --user=root \
            -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Initialize disposable Frappe v16 / ERPNext v16 site
        shell: bash
        run: |
          set -euo pipefail
          bench init --frappe-branch version-16 --skip-assets --skip-redis-config-generation \
            --python "$(command -v python)" "$BENCH_DIR"
          cd "$BENCH_DIR"
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000
          bench get-app --branch version-16 erpnext https://github.com/frappe/erpnext
          bench get-app ccpcerp "$GITHUB_WORKSPACE"
          git -C apps/ccpcerp fetch --quiet --no-tags "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          git -C apps/ccpcerp checkout --quiet --detach "$GITHUB_SHA"
          test "$(git -C apps/ccpcerp rev-parse HEAD)" = "$GITHUB_SHA"
          bench setup requirements --dev
          echo "App: $(git -C apps/ccpcerp rev-parse HEAD)"
          bench new-site "$TEST_SITE" --db-host 127.0.0.1 --db-port 3306 \
            --db-root-username root --db-root-password "$CI_DB_ROOT_PASSWORD" \
            --admin-password "$CI_ADMIN_PASSWORD"
          bench --site "$TEST_SITE" install-app erpnext
          bench --site "$TEST_SITE" install-app ccpcerp
          bench --site "$TEST_SITE" migrate
          bench --site "$TEST_SITE" set-config allow_tests true

      - name: Verify existing intercompany unit-level compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd "$BENCH_DIR"
          bench --site "$TEST_SITE" run-tests \
            --module ccpcerp.ccpc_erp.doctype.intercompany_material_billing_batch.test_intercompany_material_billing_batch

      - name: Execute real MariaDB invoice-pair rollback probes
        shell: bash
        run: |
          set -euo pipefail
          cd "$BENCH_DIR"
          bench --site "$TEST_SITE" run-tests \
            --module ccpcerp.ccpc_erp.doctype.intercompany_material_billing_batch.test_intercompany_atomic_pair_database

      - name: Report honest test boundary
        if: always()
        shell: bash
        run: |
          {
            echo "## Intercompany invoice atomicity boundary"
            echo "Disposable GitHub Actions Frappe v16 / ERPNext v16 / MariaDB only."
            echo "Reviewed app commit: $GITHUB_SHA"
            echo "SQL rollback probes write actual test-only ToDo markers into disposable MariaDB."
            echo "Invoice objects and billing batch are mocked in rollback probes:"
            echo "this proves transaction savepoint behavior, NOT yet genuine ERPNext invoices."
            echo "Unit compatibility tests are separately mocked and are NOT database acceptance."
            echo "No persistent DEVELOPMENT/PRODUCTION touched. No live billing authorization."
          } >> "$GITHUB_STEP_SUMMARY"
