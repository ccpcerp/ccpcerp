# GitHub-only disposable ERPNext/Frappe/MariaDB acceptance test.
# No CCPC site, database, credentials, schedule, deploy or self-hosted runner.
name: B-C original Withdrawal issue real ledger review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - review/bc-approval-selector-policy-2026-10-18
    paths:
      - ".github/workflows/bc-original-issue-real-ledger-review.yml"
      - "ccpcerp/ccpc_erp/bc_issue_*.py"
      - "ccpcerp/ccpc_erp/bc_mapping_workflow.py"
      - "ccpcerp/ccpc_erp/bc_mapping_lifecycle.py"
      - "ccpcerp/ccpc_erp/doctype/ccpc_*_mapping_revision/*.py"
      - "ccpcerp/ccpc_erp/doctype/ccpc_*_mapping_revision/*.json"
      - "ccpcerp/ccpc_erp/withdrawal_slip_stock.py"
      - "ccpcerp/ccpc_erp/doctype/withdrawal_slip/test_bc_original_issue_real_integration.py"
      - "ccpcerp/setup.py"

permissions:
  contents: read

concurrency:
  group: bc-original-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-real-posting:
    if: ${{ github.event.pull_request.head.repo.full_name == 'ccpcerp/ccpcerp' && github.head_ref == 'review/bc-original-issue-allocation-2026-10-20' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: "Yes"
      BENCH_DIR: ${{ github.workspace }}/../ccpc-bc-bench
      TEST_SITE: ci-withdrawal.localhost
      CI_DB_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_ADMIN_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
      CCPC_ALLOW_BC_POSTING_PROBE: isolated-only

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact reviewed same-repository PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor f08765c4d6c81665f216081d2dc16a6796c289fb HEAD
          test "$GITHUB_HEAD_REF" = "review/bc-original-issue-allocation-2026-10-20"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install disposable bench dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mariadb-client libmariadb-dev libmariadb-dev-compat pkg-config
          npm install -g yarn
          python -m pip install frappe-bench
          MYSQL_PWD="$CI_DB_ROOT_PASSWORD" mariadb --host=127.0.0.1 --user=root \
            -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Initialize disposable Frappe v16 / ERPNext v16 site
        shell: bash
        run: |
          set -euo pipefail
          bench init --frappe-branch version-16 --skip-assets --skip-redis-config-generation \
            --python "$(command -v python)" "$BENCH_DIR"
          cd "$BENCH_DIR"
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000
          bench get-app --branch version-16 erpnext https://github.com/frappe/erpnext
          bench get-app ccpcerp "$GITHUB_WORKSPACE"
          git -C apps/ccpcerp fetch --quiet --no-tags "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          git -C apps/ccpcerp checkout --quiet --detach "$GITHUB_SHA"
          test "$(git -C apps/ccpcerp rev-parse HEAD)" = "$GITHUB_SHA"
          bench setup requirements --dev
          echo "App: $(git -C apps/ccpcerp rev-parse HEAD)"
          bench new-site "$TEST_SITE" --db-host 127.0.0.1 --db-port 3306 \
            --db-root-username root --db-root-password "$CI_DB_ROOT_PASSWORD" \
            --admin-password "$CI_ADMIN_PASSWORD"
          bench --site "$TEST_SITE" install-app erpnext
          bench --site "$TEST_SITE" install-app ccpcerp
          bench --site "$TEST_SITE" migrate
          bench --site "$TEST_SITE" set-config allow_tests true

      - name: Execute B/C original issue real Frappe/MariaDB tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$BENCH_DIR"
          bench --site "$TEST_SITE" run-tests \
            --module ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_bc_original_issue_real_integration

      - name: Report honest test boundary
        if: always()
        shell: bash
        run: |
          {
            echo "## B/C original-issue acceptance boundary"
            echo "Disposable Ubuntu / MariaDB / Frappe v16 / ERPNext v16 only."
            echo "PR checkout commit: $GITHUB_SHA"
            echo "The test uses actual Finance approval and prospective mapping lifecycle services with distinct"
            echo "synthetic ERPNext identities; it checks B/C stock, ledger, retirement and replacement on real MariaDB."
            echo "Synthetic CI approvals are not signed CCPC accounting mappings or release approval."
            echo "No DEVELOPMENT or PRODUCTION accessed. No live posting approval."
          } >> "$GITHUB_STEP_SUMMARY"
