# Owner-approved schema only; disposable site, no CCPC DEV/PROD access.
name: CCPC B/C mapping real disposable schema review

on:
  push:
    branches:
      - review/bc-mapping-scopes-revisions-2026-10-18

permissions:
  contents: read

jobs:
  real-schema:
    if: github.repository == 'ccpcerp/ccpcerp'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "Yes"
      BENCH_DIR: ${{ github.workspace }}/../ccpc-bc-disposable-bench
      TEST_SITE: ci-bc-mapping.localhost
      FEATURE_BASE: 827993e45ae9321e7a936f48f7fc3b17bf842099
      CI_DB_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_ADMIN_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis-cache:
        image: redis:7-alpine
        ports: [13000:6379]
      redis-queue:
        image: redis:7-alpine
        ports: [11000:6379]

    steps:
      - name: Checkout exact review head without persistent credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source branch and exact test inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FEATURE_BASE" HEAD
          python3 - <<'PY'
          import ast
          from pathlib import Path
          f = Path("ccpcerp/ccpc_erp/doctype/ccpc_expense_mapping_scope/test_bc_mapping_real_integration.py")
          methods = [n.name for n in ast.walk(ast.parse(f.read_text()))
                     if isinstance(n, ast.FunctionDef) and n.name.startswith("test_real_")]
          assert len(methods) == 6, methods
          print("Six genuine DB test methods inventoried, not yet run.")
          PY
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install disposable prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mariadb-client libmariadb-dev libmariadb-dev-compat pkg-config
          npm install -g yarn
          python -m pip install frappe-bench
          MYSQL_PWD="$CI_DB_ROOT_PASSWORD" mariadb --host=127.0.0.1 --user=root \
            -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"
      - name: Initialize isolated Frappe v16 bench
        run: |
          set -euo pipefail
          bench init --frappe-branch version-16 --skip-assets --skip-redis-config-generation \
            --python "$(command -v python)" "$BENCH_DIR"
          cd "$BENCH_DIR"
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000
      - name: Install ERPNext v16 and exact CCPC review checkout
        run: |
          set -euo pipefail
          cd "$BENCH_DIR"
          bench get-app --branch version-16 erpnext https://github.com/frappe/erpnext
          bench get-app ccpcerp "$GITHUB_WORKSPACE"
          git -C apps/ccpcerp fetch --quiet --no-tags "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          git -C apps/ccpcerp checkout --quiet --detach "$GITHUB_SHA"
          test "$(git -C apps/ccpcerp rev-parse HEAD)" = "$GITHUB_SHA"
          git -C apps/ccpcerp merge-base --is-ancestor "$FEATURE_BASE" HEAD
          bench setup requirements --dev
      - name: Install app and schema on a disposable CI-only site
        run: |
          set -euo pipefail
          cd "$BENCH_DIR"
          bench new-site "$TEST_SITE" --db-host 127.0.0.1 --db-port 3306 \
            --db-root-username root --db-root-password "$CI_DB_ROOT_PASSWORD" \
            --admin-password "$CI_ADMIN_PASSWORD"
          bench --site "$TEST_SITE" install-app erpnext
          bench --site "$TEST_SITE" install-app ccpcerp
          bench --site "$TEST_SITE" migrate
          bench --site "$TEST_SITE" set-config allow_tests true
      - name: Run six real B/C schema, eligible-draft and approval-denial tests
        env:
          CCPC_ALLOW_BC_SCHEMA_PROBE: isolated-only
        run: |
          set -euo pipefail
          cd "$BENCH_DIR"
          bench --site "$TEST_SITE" run-tests --module ccpcerp.ccpc_erp.doctype.ccpc_expense_mapping_scope.test_bc_mapping_real_integration
      - name: Record exact limited test coverage
        if: always()
        run: |
          {
            echo "## Inert B/C mapping schema review only"
            echo "Six disposable ERPNext/MariaDB tests if completed: schema, unique scope/revision, eligible draft financial masters, approval denial."
            echo "Not financial allocation or approval workflow: no B/C posting, Stock Entry, SLE, GL, live masters or migration authorization."
            echo "No CCPC DEV/PROD access, no secret key, no self-hosted runners."
            echo "POSTING_NO_GO / PRODUCTION NO-GO / DEV_TARGET_ORIGIN_UNKNOWN_STOP."
          } >> "$GITHUB_STEP_SUMMARY"
