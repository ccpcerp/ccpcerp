# Phase 2 REVIEW ONLY: expensive isolated Frappe/ERPNext SQL tests are opt-in.
# GitHub PR "run-ci" label triggers only starter-validation (parameter defaults false).
# Run full tests only by a separately approved manual pipeline with run_integration=true.
# Do not add CCPC DEV/PROD credentials, runners, deployment steps or schedules.
version: 2.1

parameters:
  run_integration:
    type: boolean
    default: false
  # Finance lifecycle is separately authorized; default never executes its runner.
  run_finance_lifecycle:
    type: boolean
    default: false
  # Separate strictly opt-in bridge workflow; never triggered by PR labels.
  run_finance_bridge:
    type: boolean
    default: false

  # Combined report acceptance: exact-SHA, manually held, disabled by default.
  run_four_reports_integrated:
    type: boolean
    default: false

  # Synthetic-only one-time sidecar smoke, disabled on normal pushes.
  run_pr32_sidecar_smoke:
    type: boolean
    default: false

  # Confidential Integration2 restore: only manually held, restricted context.
  run_integration2_backup_restore:
    type: boolean
    default: false

  # No-backup review checks only; never accesses Context or databases.
  run_integration2_restore_preflight:
    type: boolean
    default: false

jobs:
  python-syntax:
    docker:
      - image: cimg/python:3.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Compile CCPC application Python
          command: |
            set -eu
            python --version
            python -m compileall -q ccpcerp
            python -m unittest discover -s .circleci -p 'test_ci_disposable_site_guard.py' -v
            # Cheap source-only preflight on the combined review branch.
            if [ "${CIRCLE_BRANCH:-}" = "review/four-day-one-reports-integration-2026-10-29" ]; then
              python -m unittest discover -s .circleci -p 'test_four_reports_ci_config_static.py' -v
            fi

  isolated-erpnext-integration:
    # Disposable CircleCI-only MariaDB/Redis/Frappe site. NOT persistent DEVELOPMENT.
    # Untested draft: first full run must be deliberately authorized and reviewed.
    docker:
      - image: cimg/python:3.14-node
      - image: mariadb:11.8
        environment:
          MARIADB_ROOT_PASSWORD: ccpc-ci-only-ephemeral-db
      - image: redis:7-alpine
        command: ["redis-server", "--port", "13000"]
      - image: redis:7-alpine
        command: ["redis-server", "--port", "11000"]
    resource_class: large
    environment:
      CI: "Yes"
      TEST_SITE: ci-circleci.localhost
      CI_DB_ROOT_PASSWORD: ccpc-ci-only-ephemeral-db
      CI_ADMIN_PASSWORD: ccpc-ci-only-ephemeral-admin
      CCPC_ALLOW_COMMIT_PROBE: isolated-only
      CCPC_ALLOW_CONCURRENCY_PROBE: isolated-only
      CCPC_ALLOW_HTTP_PROBE: isolated-only
      CCPC_ALLOW_CANCELLATION_PROBE: isolated-only
      CCPC_ALLOW_ACCOUNTING_PROBE: isolated-only
      CCPC_ALLOW_IC_SQL_PROBE: isolated-only
      CCPC_ALLOW_IC_REAL_INVOICES: isolated-only
      CCPC_ALLOW_BC_POSTING_PROBE: isolated-only
    steps:
      - checkout
      - run:
          name: Fail closed on unapproved CI source before installing Frappe
          command: |
            set -euo pipefail
            test "${CIRCLECI:-}" = "true" || { echo "CI identity check failed: CircleCI runner required"; exit 1; }
            test "${CIRCLE_PROJECT_USERNAME:-}" = "CCPCerp_2026" || { echo "CI identity check failed: CircleCI organization mismatch"; exit 1; }
            test "${CIRCLE_PROJECT_REPONAME:-}" = "ccpcerp" || { echo "CI identity check failed: CircleCI project mismatch"; exit 1; }
            test "${CIRCLE_BRANCH:-}" = "review/circleci-isolated-erpnext-phase2-2026-10-26" || { echo "CI identity check failed: review branch mismatch"; exit 1; }
            test "${CIRCLE_JOB:-}" = "isolated-erpnext-integration" || { echo "CI identity check failed: integration job mismatch"; exit 1; }
            test -n "${CIRCLE_PIPELINE_ID:-}" || { echo "CI identity check failed: missing pipeline ID"; exit 1; }
            test -n "${CIRCLE_WORKFLOW_ID:-}" || { echo "CI identity check failed: missing workflow ID"; exit 1; }
            test -n "${CIRCLE_BUILD_NUM:-}" || { echo "CI identity check failed: missing job number"; exit 1; }
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:-}" || { echo "CI identity check failed: checkout SHA mismatch"; exit 1; }
            echo "Approved disposable CI identity and exact checked-out commit verified"
      - run:
          name: Verify tools and required services
          command: |
            set -euo pipefail
            python --version
            node --version
            npm --version
            for port in 3306 13000 11000; do
              ready=0
              for i in $(seq 1 60); do
                if (echo >/dev/tcp/127.0.0.1/"$port") 2>/dev/null; then ready=1; break; fi
                sleep 2
              done
              test "$ready" = 1 || { echo "CI service unavailable on port $port"; exit 1; }
            done
      - run:
          name: Install disposable bench prerequisites
          no_output_timeout: 15m
          command: |
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends cron mariadb-client libmariadb-dev libmariadb-dev-compat pkg-config
            sudo npm install -g yarn
            python -m pip install --user frappe-bench
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Create isolated Frappe v16 and ERPNext v16 bench
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            BENCH_DIR="$HOME/ccpc-circleci-bench"
            APP_CHECKOUT="$PWD"
            MYSQL_PWD="$CI_DB_ROOT_PASSWORD" mariadb --host=127.0.0.1 --user=root \
              -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"
            bench init --frappe-branch version-16 --skip-assets --skip-redis-config-generation \
              --python "$(command -v python)" "$BENCH_DIR"
            cd "$BENCH_DIR"
            bench set-config -g redis_cache redis://127.0.0.1:13000
            bench set-config -g redis_queue redis://127.0.0.1:11000
            bench set-config -g redis_socketio redis://127.0.0.1:11000
            bench get-app --branch version-16 erpnext https://github.com/frappe/erpnext
            bench get-app ccpcerp "$APP_CHECKOUT"
            bench setup requirements --dev
            bench new-site "$TEST_SITE" --db-host 127.0.0.1 --db-port 3306 \
              --db-root-username root --db-root-password "$CI_DB_ROOT_PASSWORD" \
              --admin-password "$CI_ADMIN_PASSWORD"
            bench --site "$TEST_SITE" install-app erpnext
            bench --site "$TEST_SITE" install-app ccpcerp
            bench --site "$TEST_SITE" migrate
            bench --site "$TEST_SITE" set-config allow_tests true
            echo "Verified isolated custom app HEAD: $(git -C apps/ccpcerp rev-parse HEAD)"
      - run:
          name: Withdrawal Slip and genuine Finance mapping SQL/GL integration tests
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            cd "$HOME/ccpc-circleci-bench"
            for module in \
              ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_withdrawal_slip \
              ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_withdrawal_issue_safety \
              ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_withdrawal_peer_issuance \
              ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_bc_original_issue_real_integration \
              ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_withdrawal_real_ledger_integration
            do
              bench --site "$TEST_SITE" run-tests --module "$module"
            done
      - run:
          name: Intercompany billing draft-invoice and rollback tests
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            cd "$HOME/ccpc-circleci-bench"
            for module in \
              ccpcerp.ccpc_erp.doctype.intercompany_material_billing_batch.test_intercompany_material_billing_batch \
              ccpcerp.ccpc_erp.doctype.intercompany_material_billing_batch.test_intercompany_billing_approval_failures \
              ccpcerp.ccpc_erp.doctype.intercompany_material_billing_batch.test_intercompany_atomic_pair_database \
              ccpcerp.ccpc_erp.doctype.intercompany_material_billing_batch.test_intercompany_real_draft_invoice_database
            do
              bench --site "$TEST_SITE" run-tests --module "$module"
            done

  finance-lifecycle-isolated-integration:
    # Standalone disposable Finance CI job; original legacy job remains unchanged.
    # Not scheduled, never a PR label trigger: manual approval plus SHA pin.
    parameters:
      run_bridge:
        type: boolean
        default: false
    docker:
      - image: cimg/python:3.14-node
      - image: mariadb:11.8
        environment:
          MARIADB_ROOT_PASSWORD: ccpc-finance-disposable-db-only
      - image: redis:7-alpine
        command: ["redis-server", "--port", "13000"]
      - image: redis:7-alpine
        command: ["redis-server", "--port", "11000"]
    resource_class: large
    environment:
      CI: "Yes"
      TEST_SITE: ci-finance-lifecycle.localhost
      CI_DB_ROOT_PASSWORD: ccpc-finance-disposable-db-only
      CI_ADMIN_PASSWORD: ccpc-finance-disposable-admin-only
      CCPC_ALLOW_FINANCE_LIFECYCLE_TESTS: isolated-only
    steps:
      - checkout
      - run:
          name: Reject wrong Finance CI identity before any bench, DB or package operation
          command: |
            set -euo pipefail
            test "${CIRCLECI:-}" = "true"
            test "${CIRCLE_PROJECT_USERNAME:-}" = "CCPCerp_2026"
            test "${CIRCLE_PROJECT_REPONAME:-}" = "ccpcerp"
            test "${CIRCLE_BRANCH:-}" = "feature/finance-mapping-lifecycle-2026-10-28"
            test "${CIRCLE_JOB:-}" = "finance-lifecycle-isolated-integration"
            test "${TEST_SITE:-}" = "ci-finance-lifecycle.localhost"
            test -n "${CIRCLE_PIPELINE_ID:-}"
            test -n "${CIRCLE_WORKFLOW_ID:-}"
            test -n "${CIRCLE_BUILD_NUM:-}"
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:-}"
            # Supplied only via separately managed CircleCI project variable after
            # owner has authorized the exact post-harness commit; not in YAML or params.
            test -n "${CCPC_FINANCE_APPROVED_SHA:-}"
            test "${CIRCLE_SHA1}" = "${CCPC_FINANCE_APPROVED_SHA}"
            python - \<<'PY'
            from ccpcerp.ccpc_erp.ci_finance_lifecycle_site_guard import assert_finance_disposable_site
            assert_finance_disposable_site("ci-finance-lifecycle.localhost")
            print("Exact approved ephemeral Finance CI identity: PASS")
            PY
            # Start once after identity verification; each subsequent command
            # runs against the SAME cumulative, fail-closed deadline.
            python .circleci/finance_baseline_deadline.py start
            python .circleci/finance_baseline_deadline.py run python -m unittest discover -s .circleci -p 'test_finance_lifecycle_ci_guard.py' -v
            python .circleci/finance_baseline_deadline.py run python -m unittest discover -s .circleci -p 'test_finance_ci_config_static.py' -v
            python .circleci/finance_baseline_deadline.py run python -m unittest discover -s .circleci -p 'test_finance_bridge_config_static.py' -v
            python .circleci/finance_baseline_deadline.py run python -m unittest discover -s .circleci -p 'test_finance_baseline_deadline.py' -v
            python .circleci/finance_baseline_deadline.py run python -m compileall -q ccpcerp
      - run:
          name: Confirm disposable database and Redis sidecars
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            python .circleci/finance_baseline_deadline.py run bash .circleci/finance_baseline_stage.sh services
      - run:
          name: Install disposable bench with pinned Frappe and ERPNext sources
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            python .circleci/finance_baseline_deadline.py run bash .circleci/finance_baseline_stage.sh install
      - run:
          name: Finance lifecycle MariaDB service tests, no HTTP server or ledger posting
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            python .circleci/finance_baseline_deadline.py run bash .circleci/finance_baseline_stage.sh tests
      - when:
          condition: << parameters.run_bridge >>
          steps:
            - run:
                name: Signed Withdrawal to real ledger and intercompany source bridge
                no_output_timeout: 20m
                command: |
                  set -euo pipefail
                  python .circleci/finance_baseline_deadline.py run bash .circleci/finance_baseline_stage.sh bridge

  four-reports-isolated-integration:
    # Same pinned disposable Frappe/ERPNext sources as green Finance #34.
    # Independent exact-SHA, branch, site and CI identity gate in every stage.
    docker:
      - image: cimg/python:3.14-node
      - image: mariadb:11.8
        environment:
          MARIADB_ROOT_PASSWORD: ccpc-four-reports-ephemeral-only
      - image: redis:7-alpine
        command: ["redis-server", "--port", "13000"]
      - image: redis:7-alpine
        command: ["redis-server", "--port", "11000"]
    resource_class: large
    environment:
      CI: "Yes"
      TEST_SITE: ci-four-reports.localhost
      CI_DB_ROOT_PASSWORD: ccpc-four-reports-ephemeral-only
      CI_ADMIN_PASSWORD: ccpc-four-reports-ephemeral-admin-only
      CCPC_ALLOW_FOUR_REPORTS_TESTS: isolated-only
    steps:
      - checkout
      - run:
          name: Four reports exact-SHA and disposable site guard before any installation
          command: |
            set -euo pipefail
            bash .circleci/four_reports_stage.sh identity
      - run:
          name: Verify disposable MariaDB and Redis
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            python .circleci/finance_baseline_deadline.py run bash .circleci/four_reports_stage.sh services
      - run:
          name: Install pinned Frappe and ERPNext on disposable report site
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            python .circleci/finance_baseline_deadline.py run bash .circleci/four_reports_stage.sh install
      - run:
          name: Four reports native report policy and real MariaDB source/ledger report tests
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            python .circleci/finance_baseline_deadline.py run bash .circleci/four_reports_stage.sh tests

  integration2-sidecar-smoke-isolated:
    # Disposable Frappe/MariaDB pre/post proof; no backups or credentials context.
    docker:
      - image: cimg/python:3.14-node
      - image: mariadb:11.8
        environment:
          MARIADB_ROOT_PASSWORD: ccpc-smoke-disposable-root-only
      - image: redis:7-alpine
        command: ["redis-server", "--port", "13000"]
      - image: redis:7-alpine
        command: ["redis-server", "--port", "11000"]
    resource_class: large
    environment:
      TEST_SITE: ci-ccpc-pr32-restore.localhost
      CI_DB_ROOT_PASSWORD: ccpc-smoke-disposable-root-only
      CCPC_NO_BACKUP_SMOKE: disposable-only
    steps:
      - checkout
      - run:
          name: Check exact smoke project branch job and approved source SHA
          command: |
            set -euo pipefail
            python .circleci/ci_sidecar_smoke.py identity
            python -m unittest discover -s .circleci -p 'test_ci_sidecar_smoke.py' -v
            python -m compileall -q .circleci
      - run:
          name: Wait for fresh MariaDB Redis and install bench tools
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            timeout --signal=TERM --kill-after=10s 900 bash .circleci/pr32_smoke_stage.sh prerequisites
      - run:
          name: Construct source pinned Frappe ERPNext and original CCPC bench
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            timeout --signal=TERM --kill-after=10s 3000 bash .circleci/pr32_smoke_stage.sh bench
      - run:
          name: Prove scratch database absent then present against same MariaDB sidecar
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            timeout --signal=TERM --kill-after=10s 900 python .circleci/ci_sidecar_smoke.py site

  integration2-backup-restore-isolated:
    # Actual October 29 encrypted Integration2 backup: dedicated disposable CI.
    # Sensitive Context restricted by project and exact branch/no-SSH expression.
    # circleci/ GitHub App orgs do NOT support OAuth context security groups.
    docker:
      - image: cimg/python:3.14-node
      - image: mariadb:11.8
        environment:
          MARIADB_ROOT_PASSWORD: ccpc-restore-disposable-db-only
      - image: redis:7-alpine
        command: ["redis-server", "--port", "13000"]
      - image: redis:7-alpine
        command: ["redis-server", "--port", "11000"]
    resource_class: large
    environment:
      TEST_SITE: ci-ccpc-pr32-restore.localhost
      CI_DB_HOST: "127.0.0.1"
      CI_DB_NAME: ci_pr32_restore_20261030
      CI_DB_ROOT_PASSWORD: ccpc-restore-disposable-db-only
      CCPC_ALLOW_INTEGRATION2_RESTORE: approved-only
    steps:
      - checkout
      - run:
          name: Exact SHA and owner-approved confidential restore policy gate
          command: |
            set -euo pipefail
            env -u CCPC_RESTORE_OBJECT_GET_URL -u CCPC_RESTORE_AGE_IDENTITY python .circleci/restore_guard.py
            env -u CCPC_RESTORE_OBJECT_GET_URL -u CCPC_RESTORE_AGE_IDENTITY python -m compileall -q .circleci
            env -u CCPC_RESTORE_OBJECT_GET_URL -u CCPC_RESTORE_AGE_IDENTITY python -m unittest discover -s .circleci -p 'test_ci_restore_runtime.py' -v
            env -u CCPC_RESTORE_OBJECT_GET_URL -u CCPC_RESTORE_AGE_IDENTITY python -m unittest discover -s .circleci -p 'test_ci_restore_config_static.py' -v
      - run:
          name: Pre-fetch exact encrypted ciphertext while signed GET is fresh
          command: |
            set -euo pipefail
            umask 077
            # No decryption, MariaDB or bench operations occur in this stage.
            python .circleci/ci_restore_runtime.py --prefetch
      - run:
          name: Disposable MariaDB Redis and pinned Frappe prerequisites
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            env -u CCPC_RESTORE_OBJECT_GET_URL -u CCPC_RESTORE_AGE_IDENTITY timeout --signal=TERM --kill-after=10s 900 bash .circleci/pr32_restore_stage.sh prerequisites
      - run:
          name: Verify clean original source SHA and construct disposable bench
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            env -u CCPC_RESTORE_OBJECT_GET_URL -u CCPC_RESTORE_AGE_IDENTITY timeout --signal=TERM --kill-after=10s 3000 bash .circleci/pr32_restore_stage.sh bench
      - run:
          name: Decrypt and restore exact four-part source to isolated scratch only
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            umask 077
            timeout --signal=TERM --kill-after=10s 2400 python .circleci/ci_restore_runtime.py --restore

  pr32-restore-source-preflight:
    # Cheap, no-secret unit + YAML parser job; never attach restore Context.
    docker:
      - image: cimg/python:3.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify dedicated checkout identity and run only offline source tests
          command: |
            set -euo pipefail
            test "${CIRCLECI:-}" = true
            test "${CIRCLE_PROJECT_USERNAME:-}" = CCPCerp_2026
            test "${CIRCLE_PROJECT_REPONAME:-}" = ccpcerp
            test "${CIRCLE_BRANCH:-}" = review/pr32-integration2-isolated-restore-2026-10-30
            test "${CIRCLE_JOB:-}" = pr32-restore-source-preflight
            test -n "${CIRCLE_PIPELINE_ID:-}"
            test -n "${CIRCLE_WORKFLOW_ID:-}"
            test -n "${CIRCLE_BUILD_NUM:-}"
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:-}"
            python -m compileall -q .circleci
            for test in test_restore_guard.py test_ci_restore_runtime.py test_ci_restore_config_static.py test_ci_db_attestation.py test_ci_bench_preflight.py; do
              python -m unittest discover -s .circleci -p "$test" -v
            done
            echo "OFFLINE RESTORE SOURCE PREFLIGHT: PASS"

workflows:
  starter-validation:
    jobs:
      - python-syntax:
          filters:
            branches:
              ignore:
                - review/pr32-integration2-smoke-2026-10-30
                - review/pr32-integration2-isolated-restore-2026-10-30
  opt-in-isolated-erpnext:
    when: << pipeline.parameters.run_integration >>
    jobs:
      - isolated-erpnext-integration
  opt-in-finance-lifecycle:
    when: << pipeline.parameters.run_finance_lifecycle >>
    jobs:
      - finance-lifecycle-manual-approval:
          type: approval
          filters:
            branches:
              only: feature/finance-mapping-lifecycle-2026-10-28
      - finance-lifecycle-isolated-integration:
          requires:
            - finance-lifecycle-manual-approval
          filters:
            branches:
              only: feature/finance-mapping-lifecycle-2026-10-28
  opt-in-four-reports-acceptance:
    when: << pipeline.parameters.run_four_reports_integrated >>
    jobs:
      - four-reports-manual-approval:
          type: approval
          filters:
            branches:
              only: review/four-day-one-reports-integration-2026-10-29
      - four-reports-isolated-integration:
          requires:
            - four-reports-manual-approval
          filters:
            branches:
              only: review/four-day-one-reports-integration-2026-10-29
  opt-in-finance-bridge:
    when: << pipeline.parameters.run_finance_bridge >>
    jobs:
      - finance-bridge-manual-approval:
          type: approval
          filters:
            branches:
              only: feature/finance-mapping-lifecycle-2026-10-28
      - finance-lifecycle-isolated-integration:
          run_bridge: true
          requires:
            - finance-bridge-manual-approval
          filters:
            branches:
              only: feature/finance-mapping-lifecycle-2026-10-28

  opt-in-pr32-sidecar-smoke:
    when: << pipeline.parameters.run_pr32_sidecar_smoke >>
    jobs:
      - pr32-sidecar-smoke-manual-approval:
          type: approval
          filters:
            branches:
              only: review/pr32-integration2-smoke-2026-10-30
      - integration2-sidecar-smoke-isolated:
          requires:
            - pr32-sidecar-smoke-manual-approval
          filters:
            branches:
              only: review/pr32-integration2-smoke-2026-10-30

  # Owner-approved ONE-TIME restore; no automatic runs or fork/PR labels.
  opt-in-integration2-backup-restore:
    when: << pipeline.parameters.run_integration2_backup_restore >>
    jobs:
      - integration2-restore-manual-approval:
          type: approval
          filters:
            branches:
              only: review/pr32-integration2-isolated-restore-2026-10-30
      - integration2-backup-restore-isolated:
          context: ccpc-pr32-integration2-restore-once
          requires:
            - integration2-restore-manual-approval
          filters:
            branches:
              only: review/pr32-integration2-isolated-restore-2026-10-30

  # Separate low-cost source-only check. No secret context, DB, or backup.
  opt-in-integration2-source-preflight:
    when: << pipeline.parameters.run_integration2_restore_preflight >>
    jobs:
      - pr32-source-preflight-manual-approval:
          type: approval
          filters:
            branches:
              only: review/pr32-integration2-isolated-restore-2026-10-30
      - pr32-restore-source-preflight:
          requires:
            - pr32-source-preflight-manual-approval
          filters:
            branches:
              only: review/pr32-integration2-isolated-restore-2026-10-30
