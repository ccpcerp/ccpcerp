# Phase 2 REVIEW ONLY: expensive isolated Frappe/ERPNext SQL tests are opt-in.
# GitHub PR "run-ci" label triggers only starter-validation (parameter defaults false).
# Run full tests only by a separately approved manual pipeline with run_integration=true.
# Do not add CCPC DEV/PROD credentials, runners, deployment steps or schedules.
version: 2.1

parameters:
  run_integration:
    type: boolean
    default: false
  # Finance lifecycle is separately authorized; default never executes its runner.
  run_finance_lifecycle:
    type: boolean
    default: false

jobs:
  python-syntax:
    docker:
      - image: cimg/python:3.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Compile CCPC application Python
          command: |
            set -eu
            python --version
            python -m compileall -q ccpcerp
            python -m unittest discover -s .circleci -p 'test_ci_disposable_site_guard.py' -v

  isolated-erpnext-integration:
    # Disposable CircleCI-only MariaDB/Redis/Frappe site. NOT persistent DEVELOPMENT.
    # Untested draft: first full run must be deliberately authorized and reviewed.
    docker:
      - image: cimg/python:3.14-node
      - image: mariadb:11.8
        environment:
          MARIADB_ROOT_PASSWORD: ccpc-ci-only-ephemeral-db
      - image: redis:7-alpine
        command: ["redis-server", "--port", "13000"]
      - image: redis:7-alpine
        command: ["redis-server", "--port", "11000"]
    resource_class: large
    environment:
      CI: "Yes"
      TEST_SITE: ci-circleci.localhost
      CI_DB_ROOT_PASSWORD: ccpc-ci-only-ephemeral-db
      CI_ADMIN_PASSWORD: ccpc-ci-only-ephemeral-admin
      CCPC_ALLOW_COMMIT_PROBE: isolated-only
      CCPC_ALLOW_CONCURRENCY_PROBE: isolated-only
      CCPC_ALLOW_HTTP_PROBE: isolated-only
      CCPC_ALLOW_CANCELLATION_PROBE: isolated-only
      CCPC_ALLOW_ACCOUNTING_PROBE: isolated-only
      CCPC_ALLOW_IC_SQL_PROBE: isolated-only
      CCPC_ALLOW_IC_REAL_INVOICES: isolated-only
      CCPC_ALLOW_BC_POSTING_PROBE: isolated-only
    steps:
      - checkout
      - run:
          name: Fail closed on unapproved CI source before installing Frappe
          command: |
            set -euo pipefail
            test "${CIRCLECI:-}" = "true" || { echo "CI identity check failed: CircleCI runner required"; exit 1; }
            test "${CIRCLE_PROJECT_USERNAME:-}" = "CCPCerp_2026" || { echo "CI identity check failed: CircleCI organization mismatch"; exit 1; }
            test "${CIRCLE_PROJECT_REPONAME:-}" = "ccpcerp" || { echo "CI identity check failed: CircleCI project mismatch"; exit 1; }
            test "${CIRCLE_BRANCH:-}" = "review/circleci-isolated-erpnext-phase2-2026-10-26" || { echo "CI identity check failed: review branch mismatch"; exit 1; }
            test "${CIRCLE_JOB:-}" = "isolated-erpnext-integration" || { echo "CI identity check failed: integration job mismatch"; exit 1; }
            test -n "${CIRCLE_PIPELINE_ID:-}" || { echo "CI identity check failed: missing pipeline ID"; exit 1; }
            test -n "${CIRCLE_WORKFLOW_ID:-}" || { echo "CI identity check failed: missing workflow ID"; exit 1; }
            test -n "${CIRCLE_BUILD_NUM:-}" || { echo "CI identity check failed: missing job number"; exit 1; }
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:-}" || { echo "CI identity check failed: checkout SHA mismatch"; exit 1; }
            echo "Approved disposable CI identity and exact checked-out commit verified"
      - run:
          name: Verify tools and required services
          command: |
            set -euo pipefail
            python --version
            node --version
            npm --version
            for port in 3306 13000 11000; do
              ready=0
              for i in $(seq 1 60); do
                if (echo >/dev/tcp/127.0.0.1/"$port") 2>/dev/null; then ready=1; break; fi
                sleep 2
              done
              test "$ready" = 1 || { echo "CI service unavailable on port $port"; exit 1; }
            done
      - run:
          name: Install disposable bench prerequisites
          no_output_timeout: 15m
          command: |
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends cron mariadb-client libmariadb-dev libmariadb-dev-compat pkg-config
            sudo npm install -g yarn
            python -m pip install --user frappe-bench
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Create isolated Frappe v16 and ERPNext v16 bench
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            BENCH_DIR="$HOME/ccpc-circleci-bench"
            APP_CHECKOUT="$PWD"
            MYSQL_PWD="$CI_DB_ROOT_PASSWORD" mariadb --host=127.0.0.1 --user=root \
              -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"
            bench init --frappe-branch version-16 --skip-assets --skip-redis-config-generation \
              --python "$(command -v python)" "$BENCH_DIR"
            cd "$BENCH_DIR"
            bench set-config -g redis_cache redis://127.0.0.1:13000
            bench set-config -g redis_queue redis://127.0.0.1:11000
            bench set-config -g redis_socketio redis://127.0.0.1:11000
            bench get-app --branch version-16 erpnext https://github.com/frappe/erpnext
            bench get-app ccpcerp "$APP_CHECKOUT"
            bench setup requirements --dev
            bench new-site "$TEST_SITE" --db-host 127.0.0.1 --db-port 3306 \
              --db-root-username root --db-root-password "$CI_DB_ROOT_PASSWORD" \
              --admin-password "$CI_ADMIN_PASSWORD"
            bench --site "$TEST_SITE" install-app erpnext
            bench --site "$TEST_SITE" install-app ccpcerp
            bench --site "$TEST_SITE" migrate
            bench --site "$TEST_SITE" set-config allow_tests true
            echo "Verified isolated custom app HEAD: $(git -C apps/ccpcerp rev-parse HEAD)"
      - run:
          name: Withdrawal Slip and genuine Finance mapping SQL/GL integration tests
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            cd "$HOME/ccpc-circleci-bench"
            for module in \
              ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_withdrawal_slip \
              ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_withdrawal_issue_safety \
              ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_withdrawal_peer_issuance \
              ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_bc_original_issue_real_integration \
              ccpcerp.ccpc_erp.doctype.withdrawal_slip.test_withdrawal_real_ledger_integration
            do
              bench --site "$TEST_SITE" run-tests --module "$module"
            done
      - run:
          name: Intercompany billing draft-invoice and rollback tests
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            cd "$HOME/ccpc-circleci-bench"
            for module in \
              ccpcerp.ccpc_erp.doctype.intercompany_material_billing_batch.test_intercompany_material_billing_batch \
              ccpcerp.ccpc_erp.doctype.intercompany_material_billing_batch.test_intercompany_billing_approval_failures \
              ccpcerp.ccpc_erp.doctype.intercompany_material_billing_batch.test_intercompany_atomic_pair_database \
              ccpcerp.ccpc_erp.doctype.intercompany_material_billing_batch.test_intercompany_real_draft_invoice_database
            do
              bench --site "$TEST_SITE" run-tests --module "$module"
            done

  finance-lifecycle-isolated-integration:
    # Standalone disposable Finance CI job; original legacy job remains unchanged.
    # Not scheduled, never a PR label trigger: manual approval plus SHA pin.
    docker:
      - image: cimg/python:3.14-node
      - image: mariadb:11.8
        environment:
          MARIADB_ROOT_PASSWORD: ccpc-finance-disposable-db-only
      - image: redis:7-alpine
        command: ["redis-server", "--port", "13000"]
      - image: redis:7-alpine
        command: ["redis-server", "--port", "11000"]
    resource_class: large
    environment:
      CI: "Yes"
      TEST_SITE: ci-finance-lifecycle.localhost
      CI_DB_ROOT_PASSWORD: ccpc-finance-disposable-db-only
      CI_ADMIN_PASSWORD: ccpc-finance-disposable-admin-only
      CCPC_ALLOW_FINANCE_LIFECYCLE_TESTS: isolated-only
    steps:
      - checkout
      - run:
          name: Reject wrong Finance CI identity before any bench, DB or package operation
          command: |
            set -euo pipefail
            test "${CIRCLECI:-}" = "true"
            test "${CIRCLE_PROJECT_USERNAME:-}" = "CCPCerp_2026"
            test "${CIRCLE_PROJECT_REPONAME:-}" = "ccpcerp"
            test "${CIRCLE_BRANCH:-}" = "feature/finance-mapping-lifecycle-2026-10-28"
            test "${CIRCLE_JOB:-}" = "finance-lifecycle-isolated-integration"
            test "${TEST_SITE:-}" = "ci-finance-lifecycle.localhost"
            test -n "${CIRCLE_PIPELINE_ID:-}"
            test -n "${CIRCLE_WORKFLOW_ID:-}"
            test -n "${CIRCLE_BUILD_NUM:-}"
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:-}"
            # Supplied only via separately managed CircleCI project variable after
            # owner has authorized the exact post-harness commit; not in YAML or params.
            test -n "${CCPC_FINANCE_APPROVED_SHA:-}"
            test "${CIRCLE_SHA1}" = "${CCPC_FINANCE_APPROVED_SHA}"
            python - \<<'PY'
            from ccpcerp.ccpc_erp.ci_finance_lifecycle_site_guard import assert_finance_disposable_site
            assert_finance_disposable_site("ci-finance-lifecycle.localhost")
            print("Exact approved ephemeral Finance CI identity: PASS")
            PY
            python -m unittest discover -s .circleci -p 'test_finance_lifecycle_ci_guard.py' -v
            python -m unittest discover -s .circleci -p 'test_finance_ci_config_static.py' -v
            python -m compileall -q ccpcerp
      - run:
          name: Confirm disposable database and Redis sidecars
          command: |
            set -euo pipefail
            for port in 3306 13000 11000; do
              ready=0
              for i in $(seq 1 60); do
                if (echo >/dev/tcp/127.0.0.1/"$port") 2>/dev/null; then
                  ready=1
                  break
                fi
                sleep 2
              done
              test "$ready" = 1 || { echo "Required ephemeral CI sidecar unavailable"; exit 1; }
            done
      - run:
          name: Install disposable bench with pinned Frappe and ERPNext sources
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            APP_CHECKOUT="$PWD"
            BENCH_DIR="$HOME/ccpc-finance-lifecycle-bench"
            FRAPPE_SHA=988e54f3c4c291e2077a83809663f123731abe76
            ERPNEXT_SHA=4048fb70e14d1843956fcdabb7c3cca75a1cbcdd
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends cron mariadb-client libmariadb-dev libmariadb-dev-compat pkg-config
            sudo npm install -g yarn
            python -m pip install --user frappe-bench
            MYSQL_PWD="$CI_DB_ROOT_PASSWORD" mariadb --host=127.0.0.1 --user=root \
              -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"
            bench init --frappe-branch version-16 --skip-assets --skip-redis-config-generation \
              --python "$(command -v python)" "$BENCH_DIR"
            cd "$BENCH_DIR"
            git -C apps/frappe fetch --depth 1 origin "$FRAPPE_SHA"
            git -C apps/frappe checkout --detach "$FRAPPE_SHA"
            bench set-config -g redis_cache redis://127.0.0.1:13000
            bench set-config -g redis_queue redis://127.0.0.1:11000
            bench set-config -g redis_socketio redis://127.0.0.1:11000
            bench get-app --branch version-16 erpnext https://github.com/frappe/erpnext
            git -C apps/erpnext fetch --depth 1 origin "$ERPNEXT_SHA"
            git -C apps/erpnext checkout --detach "$ERPNEXT_SHA"
            bench get-app ccpcerp "$APP_CHECKOUT"
            test "$(git -C apps/frappe rev-parse HEAD)" = "$FRAPPE_SHA"
            test "$(git -C apps/erpnext rev-parse HEAD)" = "$ERPNEXT_SHA"
            test "$(git -C apps/ccpcerp rev-parse HEAD)" = "$CCPC_FINANCE_APPROVED_SHA"
            bench setup requirements --dev
            bench new-site "$TEST_SITE" --db-host 127.0.0.1 --db-port 3306 \
              --db-root-username root --db-root-password "$CI_DB_ROOT_PASSWORD" \
              --admin-password "$CI_ADMIN_PASSWORD"
            bench --site "$TEST_SITE" install-app erpnext
            bench --site "$TEST_SITE" install-app ccpcerp
            bench --site "$TEST_SITE" migrate
            bench --site "$TEST_SITE" set-config allow_tests true
            echo "Disposable Finance site installed: no persistent CCPC site accessed"
      - run:
          name: Finance lifecycle MariaDB service tests, no HTTP server or ledger posting
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            cd "$HOME/ccpc-finance-lifecycle-bench"
            test "$(git -C apps/ccpcerp rev-parse HEAD)" = "${CCPC_FINANCE_APPROVED_SHA:?}"
            bench --site "$TEST_SITE" run-tests \
              --module ccpcerp.ccpc_erp.test_finance_lifecycle_disposable_integration
            echo "Finance disposable database tests finished; reconcile results before further stages"

workflows:
  starter-validation:
    jobs:
      - python-syntax
  opt-in-isolated-erpnext:
    when: << pipeline.parameters.run_integration >>
    jobs:
      - isolated-erpnext-integration
  opt-in-finance-lifecycle:
    when: << pipeline.parameters.run_finance_lifecycle >>
    jobs:
      - finance-lifecycle-manual-approval:
          type: approval
          filters:
            branches:
              only: feature/finance-mapping-lifecycle-2026-10-28
      - finance-lifecycle-isolated-integration:
          requires:
            - finance-lifecycle-manual-approval
          filters:
            branches:
              only: feature/finance-mapping-lifecycle-2026-10-28
